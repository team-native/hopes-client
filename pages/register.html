<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · hopes</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-shell">
    <section class="auth-brand">
      <div class="auth-brand-top">
        <span class="brand-mark">h</span>
        <span class="school">hopes · 광주소프트웨어마이스터고</span>
        <span class="club-tag"><span class="club-mark" aria-hidden="true"></span>Native</span>
      </div>
      <div class="auth-brand-hero">
        <h1>GSM 후배라면<br />누구나 환영해요</h1>
        <p>학교 이메일(@gsm.hs.kr)로 가입하고, 선배들의 진짜 경험이 담긴 답변을 만나보세요.</p>
        <div class="auth-badges">
          <span class="auth-badge">소프트웨어개발</span>
          <span class="auth-badge">임베디드</span>
          <span class="auth-badge">인공지능</span>
        </div>
      </div>
      <div class="auth-brand-foot">© 광주소프트웨어마이스터고등학교 · GSM Chatbot</div>
    </section>

    <section class="auth-form-pane">
      <div class="auth-card">
        <h2>회원가입</h2>
        <p class="subtitle">학교 이메일 형식(s00000@gsm.hs.kr)으로 가입할 수 있어요.</p>

        <div class="field">
          <label>이메일</label>
          <div class="inline-row">
            <input id="email" type="email" placeholder="s20000@gsm.hs.kr" maxlength="255" />
            <button class="secondary" id="send-code-btn" type="button">인증번호 전송</button>
          </div>
          <span class="error-msg" id="err-email"></span>
        </div>
        <div class="field">
          <label>인증번호</label>
          <div class="inline-row">
            <input id="code" placeholder="이메일로 받은 6자리 숫자" inputmode="numeric" maxlength="6" />
            <button class="secondary" id="confirm-code-btn" type="button">확인</button>
          </div>
          <span class="code-hint" id="code-hint"></span>
          <span class="error-msg" id="err-code"></span>
        </div>

        <fieldset id="signup-fields" disabled style="border:none;padding:0;margin:0;opacity:.5;">
          <div class="field">
            <label>아이디</label>
            <input id="username" placeholder="로그인에 사용할 아이디" maxlength="50" />
            <span class="error-msg" id="err-username"></span>
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input id="password" type="password" placeholder="영문+숫자 포함 8~15자" />
            <span class="error-msg" id="err-password"></span>
          </div>
          <div class="field">
            <label>비밀번호 확인</label>
            <input id="password2" type="password" />
            <span class="error-msg" id="err-password2"></span>
          </div>
          <div class="row">
            <div class="field">
              <label>성별 <span class="optional">(선택)</span></label>
              <select id="gender">
                <option value="">선택 안 함</option>
                <option value="남">남</option>
                <option value="여">여</option>
              </select>
            </div>
            <div class="field">
              <label>기수 <span class="optional">(선택)</span></label>
              <input id="cohort" type="number" min="1" max="100" placeholder="예: 8" />
              <span class="error-msg" id="err-cohort"></span>
            </div>
          </div>
          <div class="field">
            <label>전공 <span class="optional">(선택)</span></label>
            <select id="major">
              <option value="">선택 안 함</option>
              <option value="소프트웨어개발과">소프트웨어개발과</option>
              <option value="임베디드소프트웨어과">임베디드소프트웨어과</option>
              <option value="인공지능소프트웨어과">인공지능소프트웨어과</option>
            </select>
          </div>
        </fieldset>

        <button class="full" id="register-btn" disabled>회원가입</button>
        <div class="auth-links"><a href="/pages/login.html">← 이미 계정이 있으신가요? 로그인</a></div>
      </div>
    </section>
  </div>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>

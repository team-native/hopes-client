<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마이페이지 · hopes</title>
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/settings.css" />
</head>
<body>
  <div class="page-wrap">
    <div class="page-topbar">
      <div class="page-brand">
        <span class="brand-mark">h</span>
        <span class="brand-text">
          <span class="brand-title">hopes</span>
          <span class="brand-sub">광주소프트웨어마이스터고<span class="club-tag"><span class="club-mark" aria-hidden="true"></span>Native</span></span>
        </span>
      </div>
      <a class="back-link" href="/pages/chat.html">← 채팅으로</a>
    </div>
    <h1>마이페이지</h1>

    <div class="card">
      <h2>프로필</h2>
      <label>아이디</label>
      <input id="username" />
      <span class="error-msg" id="err-username"></span>

      <label>닉네임</label>
      <input id="nickname" />
      <span class="error-msg" id="err-nickname"></span>

      <label>프로필 이미지 URL</label>
      <div class="inline-row">
        <input id="profileImage" placeholder="https://..." />
        <img id="profile-preview" alt="" style="width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border);" />
      </div>

      <label>자기소개 (AI 응답 개인화에 활용됩니다)</label>
      <textarea id="bio" class="tall" placeholder="예: 프론트엔드에 관심 많은 8기 학생이에요."></textarea>

      <div class="actions">
        <button id="save-btn">저장</button>
      </div>
    </div>

    <div class="card">
      <h2>계정 정보 (수정 불가)</h2>
      <p class="readonly-field">이메일: <b id="v-email"></b></p>
      <p class="readonly-field">성별: <b id="v-gender"></b></p>
      <p class="readonly-field">전공: <b id="v-major"></b></p>
      <p class="readonly-field">기수: <b id="v-cohort"></b></p>
    </div>
  </div>
  <script type="module" src="/js/mypage.js"></script>
</body>
</html>
